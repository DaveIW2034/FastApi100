services:
  mysql:
    image: mysql:8.0
    container_name: fastapi100-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: fastapi100-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # 可选：用于在容器里跑当前项目脚本（非 FastAPI 服务）
  # 当前 app/main.py 只是日志示例，不是 ASGI 服务入口
  app:
    image: python:3.9-slim
    container_name: fastapi100-app
    profiles: ["app"]
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL: mysql+aiomysql://root:root@mysql:3306/testdb
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python -m app.main"
    labels:
      logging: "promtail"
      app: "fastapi100"
      service: "api"
      env: "dev"

volumes:
  mysql_data:
  redis_data:
